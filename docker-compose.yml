version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: severity-prediction-project:latest
    container_name: severity_prediction_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./outputs:/app/outputs
    restart: unless-stopped
